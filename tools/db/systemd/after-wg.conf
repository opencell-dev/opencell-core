# /etc/systemd/system/{etcd,pgbackrest}.service.d/opencell.conf (plan (a)):
# the service binds to this host's wg0 address. Review final m9: Debian's
# etcd unit restarts only on-abnormal, so an exit with an error (a bind failure
# while wg0's address is late) would leave it down: retry every 5 s instead.
[Unit]
After=wg-quick@wg0.service
Wants=wg-quick@wg0.service

[Service]
Restart=on-failure
RestartSec=5s
