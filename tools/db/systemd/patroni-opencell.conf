# /etc/systemd/system/patroni@.service.d/opencell.conf (plan (a)): Patroni
# binds to this host's wg0 address and needs etcd; if it dies it comes back
# (a leader's watchdog still resets the host if it does not come back in time:
# review final m7 -- a killed Patroni must reopen /dev/watchdog within about
# 25 s of its last keepalive, so it restarts after 2 s, not 10).
[Unit]
After=wg-quick@wg0.service etcd.service
Wants=wg-quick@wg0.service

[Service]
Restart=on-failure
RestartSec=2s
