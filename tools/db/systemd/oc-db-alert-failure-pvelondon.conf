# Drop-in for pvelondon only (review N2, N5), installed as
# /etc/systemd/system/oc-db-alert-failure@.service.d/pvelondon.conf.
#
# No alert-smtp.env exists on pvelondon (spec Sec9.3 places it only on
# oc-ldn-1, oc-db-1 and oc-core-2), so there is no credential for
# LoadCredential= to load; oc-db-alert-mail then falls back to the local
# mail path (/usr/sbin/sendmail -t to root), which Proxmox forwards per its
# own notification configuration -- the user must have that root mail
# forwarding set up on this host (tools/db/README.md; plan (a) Task 14, the
# snapshot timer step).
#
# The SMTP-mode hardening in oc-db-alert-failure@.service assumes the
# process needs nothing but its loaded credential and outbound TLS. Local
# mail submission needs neither, but it does need to actually reach
# pvelondon's own MTA, whose submission permissions and spool path plan (a)
# does not control and cannot verify from the laptop. Rather than guess a
# ProtectSystem=strict allow-list that might silently break delivery, this
# drop-in reverts to running as root (which can always talk to the local
# MTA) and removes the filesystem sandboxing; NoNewPrivileges is left in
# effect (harmless for root -- it blocks only a privilege *escalation* a
# setuid/setgid binary would otherwise grant, which root does not need).
[Service]
LoadCredential=
DynamicUser=no
User=root
ProtectSystem=no
ProtectHome=no
